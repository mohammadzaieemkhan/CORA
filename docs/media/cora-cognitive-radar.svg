<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A17" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Polygon Fill Gradient -->
    <radialGradient id="polyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="radarGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .pulse-radar-polygon {
      animation: pulsePoly 5s ease-in-out infinite alternate;
      transform-origin: 210px 200px;
    }
    .orbit-scan {
      transform-origin: 210px 200px;
      animation: sweepRadar 6s linear infinite;
    }
    .node-ping {
      animation: pingDot 2.5s ease-in-out infinite alternate;
    }
    .progress-bar-fill {
      animation: barGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulsePoly {
      0% { transform: scale(0.96); opacity: 0.85; }
      100% { transform: scale(1.03); opacity: 1; }
    }
    @keyframes sweepRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pingDot {
      0% { r: 4px; filter: drop-shadow(0 0 2px #38BDF8); }
      100% { r: 6.5px; filter: drop-shadow(0 0 8px #F472B6); }
    }
    @keyframes barGlow {
      0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 7px rgba(129, 140, 248, 0.8)); }
    }
  </style>

  <!-- Container Box -->
  <rect width="880" height="400" rx="14" fill="url(#radarBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="880" height="400" rx="14" fill="url(#radarGrid)" />

  <!-- ==================== LEFT: RADAR CHART (Center: 210, 200) ==================== -->
  <g>
    <!-- Concentric Hexagons (20%, 40%, 60%, 80%, 100%) Radius: 30, 60, 90, 120, 150 -->
    <!-- Center (210, 200) -->
    <!-- Angles: 0° (top: 210, 50), 60° (340, 125), 120° (340, 275), 180° (210, 350), 240° (80, 275), 300° (80, 125) -->

    <!-- R = 150 (100%) -->
    <polygon points="210,50 340,125 340,275 210,350 80,275 80,125" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <!-- R = 120 (80%) -->
    <polygon points="210,80 314,140 314,260 210,320 106,260 106,140" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- R = 90 (60%) -->
    <polygon points="210,110 288,155 288,245 210,290 132,245 132,155" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
    <!-- R = 60 (40%) -->
    <polygon points="210,140 262,170 262,230 210,260 158,230 158,170" fill="none" stroke="#1E293B" stroke-width="1" />
    <!-- R = 30 (20%) -->
    <polygon points="210,170 236,185 236,215 210,230 184,215 184,185" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Axis Rays -->
    <line x1="210" y1="200" x2="210" y2="50" stroke="#475569" stroke-width="1" />
    <line x1="210" y1="200" x2="340" y2="125" stroke="#475569" stroke-width="1" />
    <line x1="210" y1="200" x2="340" y2="275" stroke="#475569" stroke-width="1" />
    <line x1="210" y1="200" x2="210" y2="350" stroke="#475569" stroke-width="1" />
    <line x1="210" y1="200" x2="80" y2="275" stroke="#475569" stroke-width="1" />
    <line x1="210" y1="200" x2="80" y2="125" stroke="#475569" stroke-width="1" />

    <!-- Animated Radar Sweeper Line -->
    <line x1="210" y1="200" x2="210" y2="50" stroke="#38BDF8" stroke-width="1.5" class="orbit-scan" opacity="0.4" />

    <!-- ACTIVE COGNITIVE PROFILE POLYGON (Sample: Reasoning 92%, Domain 80%, Creativity 45%, Structure 70%, Precision 85%, Code 88%) -->
    <!-- R_scaled: Reasoning=138, Domain=120, Creativity=67, Structure=105, Precision=127, Code=132 -->
    <!-- Points:
         Reasoning: (210, 62)
         Domain: (314, 140)
         Creativity: (268, 233)
         Structure: (210, 305)
         Precision: (100, 263)
         Code: (96, 134)
    -->
    <polygon points="210,62 314,140 268,233 210,305 100,263 96,134" fill="url(#polyGrad)" stroke="#38BDF8" stroke-width="2.2" class="pulse-radar-polygon" filter="url(#radarGlow)" />

    <!-- Radar Dimension Points -->
    <circle cx="210" cy="62" r="5" fill="#38BDF8" class="node-ping" />
    <circle cx="314" cy="140" r="5" fill="#818CF8" class="node-ping" />
    <circle cx="268" cy="233" r="5" fill="#F472B6" class="node-ping" />
    <circle cx="210" cy="305" r="5" fill="#C084FC" class="node-ping" />
    <circle cx="100" cy="263" r="5" fill="#34D399" class="node-ping" />
    <circle cx="96" cy="134" r="5" fill="#FBBF24" class="node-ping" />

    <!-- Labels around Radar -->
    <text x="210" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">REASONING (92)</text>
    <text x="355" y="128" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#818CF8">DOMAIN (80)</text>
    <text x="355" y="282" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#F472B6">CREATIVE (45)</text>
    <text x="210" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#C084FC">STRUCTURE (70)</text>
    <text x="65" y="282" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#34D399">PRECISION (85)</text>
    <text x="65" y="128" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FBBF24">CODE (88)</text>
  </g>

  <!-- ==================== RIGHT: REAL-TIME TELEMETRY PANEL ==================== -->
  <g transform="translate(460, 24)">
    <!-- Header title -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="1.2">
      COGNITIVE SYNTHESIS TELEMETRY
    </text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">
      Multi-Dimensional Score Breakdown
    </text>

    <!-- Bars Container -->
    <g transform="translate(0, 56)">
      <!-- Dimension 1: Reasoning -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Reasoning Depth (Weight: 30% • α: 2.21)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38BDF8">92 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="358" height="7" rx="3.5" fill="#38BDF8" y="18" class="progress-bar-fill" />
      </g>

      <!-- Dimension 2: Code Complexity -->
      <g transform="translate(0, 38)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Code Complexity (Weight: 25%)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#FBBF24">88 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="343" height="7" rx="3.5" fill="#FBBF24" y="18" class="progress-bar-fill" />
      </g>

      <!-- Dimension 3: Precision Required -->
      <g transform="translate(0, 76)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Precision Required (Weight: 10%)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#34D399">85 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="331" height="7" rx="3.5" fill="#34D399" y="18" class="progress-bar-fill" />
      </g>

      <!-- Dimension 4: Domain Specificity -->
      <g transform="translate(0, 114)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Domain Specificity (Weight: 20% • α: 1.40)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#818CF8">80 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="312" height="7" rx="3.5" fill="#818CF8" y="18" class="progress-bar-fill" />
      </g>

      <!-- Dimension 5: Structural Complexity -->
      <g transform="translate(0, 152)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Structural Complexity (Weight: 15% • α: 0.07)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#C084FC">70 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="273" height="7" rx="3.5" fill="#C084FC" y="18" class="progress-bar-fill" />
      </g>

      <!-- Dimension 6: Creative Demand -->
      <g transform="translate(0, 190)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Creative Demand (Weight: 20% • α: 0.06)</text>
        <text x="390" y="12" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#F472B6">45 / 100</text>
        <rect width="390" height="7" rx="3.5" fill="#1E293B" y="18" />
        <rect width="175" height="7" rx="3.5" fill="#F472B6" y="18" class="progress-bar-fill" />
      </g>
    </g>

    <!-- Composite Routing Outcome Box -->
    <g transform="translate(0, 290)">
      <rect width="390" height="60" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
      <g transform="translate(14, 14)">
        <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#A5B4FC">AGGREGATE DECISION</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#38BDF8">
          Composite Score: 83.4 → Tier 3
        </text>
      </g>
      <g transform="translate(240, 14)">
        <rect width="136" height="32" rx="6" fill="#4338CA" />
        <text x="68" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">
          Nemotron 3 Super
        </text>
      </g>
    </g>
  </g>
</svg>
